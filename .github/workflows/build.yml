name: Build Docker image

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

# UniFi Controller version is read from the UNIFI_VERSION file at the repo root.
# To upgrade: edit that file, commit, and push.
env:
  TEST_TAG: ghcr.io/${{ github.repository_owner }}/unifi:test

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read UniFi version
        id: version
        run: echo "value=$(tr -d '[:space:]' < UNIFI_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Update README and Dockerfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          VER: ${{ steps.version.outputs.value }}
        run: |
          # Update the version table in README.md
          sed -i "s/| \`latest\` | \*\*v[0-9]*\.[0-9]*\.[0-9]*\*\* /| \`latest\` | **v${VER}** /" README.md
          sed -i "s/| \`master\` | \*\*v[0-9]*\.[0-9]*\.[0-9]*\*\* /| \`master\` | **v${VER}** /" README.md
          sed -i "s/(updated [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\})/(updated $(date +%Y-%m-%d))/" README.md
          # Keep the Dockerfile's default PKGURL in sync too
          sed -i "s#^ARG PKGURL=https://dl.ui.com/unifi/.*/unifi_sysvinit_all.deb#ARG PKGURL=https://dl.ui.com/unifi/${VER}/unifi_sysvinit_all.deb#" Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md Dockerfile || git commit -am "chore: auto-update README/Dockerfile to UniFi v${VER}"
          git push

      - name: Prepare
        id: prep
        run: |
          DOCKER_IMAGE=ghcr.io/${{ github.repository_owner }}/unifi
          VERSION=noop

          if [ "${{ github.event_name }}" = "schedule" ]; then
            VERSION=nightly
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/* ]]; then
            VERSION=$(echo ${GITHUB_REF#refs/heads/} | sed -r 's#/+#-#g')
            if [ "${{ github.event.repository.default_branch }}" = "$VERSION" ]; then
              VERSION=latest
            fi
          elif [[ $GITHUB_REF == refs/pull/* ]]; then
            VERSION=pr-${{ github.event.number }}
          fi

          TAGS="${DOCKER_IMAGE}:${VERSION}"

          if [[ $VERSION =~ ^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            MINOR=${VERSION%.*}
            MAJOR=${MINOR%.*}
            TAGS="$TAGS,${DOCKER_IMAGE}:${MINOR},${DOCKER_IMAGE}:${MAJOR}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAGS="$TAGS,${DOCKER_IMAGE}:sha-${GITHUB_SHA::8}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "pkgurl=https://dl.ui.com/unifi/${{ steps.version.outputs.value }}/unifi_sysvinit_all.deb" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and export to Docker (test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
          build-args: |
            PKGURL=${{ steps.prep.outputs.pkgurl }}

      - name: Test image
        run: |
          docker run -d --rm --name unifitest ${{ env.TEST_TAG }}
          sleep 35
          for i in $(seq 1 10); do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' unifitest 2>/dev/null || echo '"unknown"')
            [ "$STATUS" = '"healthy"' ] && break || sleep 35
          done
          STATUS=$(docker inspect --format='{{json .State.Health.Status}}' unifitest)
          [ "$STATUS" = '"healthy"' ] || (docker logs unifitest && exit 1)
          docker stop unifitest

      - name: Build and push container image
        uses: docker/build-push-action@v6
        id: docker_build
        with:
          context: .
          platforms: linux/arm64/v8,linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            PKGURL=${{ steps.prep.outputs.pkgurl }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.version=${{ steps.prep.outputs.version }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
